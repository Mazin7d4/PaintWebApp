name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - run: npm run build:core
      - run: npm run build:cli
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:web
      - name: Render example GIFs
        run: |
          mkdir -p examples/out
          node packages/cli/dist/bin.js check examples/bouncing-ball.paint.json
          node packages/cli/dist/bin.js render examples/bouncing-ball.paint.json -o examples/out/bouncing-ball.gif
          node packages/cli/dist/bin.js render examples/ink-logo-reveal.paint.json -o examples/out/ink-logo-reveal.gif
          node packages/cli/dist/bin.js render examples/neon-pulse.paint.json -o examples/out/neon-pulse.gif
      - uses: actions/upload-artifact@v4
        with:
          name: example-gifs
          path: examples/out/*.gif
