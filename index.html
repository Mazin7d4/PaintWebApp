<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Studio 🎨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-background"></div>
    <div class="container">
        <header class="app-header">
            <div class="logo-badge">
                <span class="logo-icon">🎨</span>
                <span class="logo-text">Paint Studio</span>
                <span class="version-tag">Pro</span>
            </div>
            <p class="app-subtitle">Unleash your creativity on an infinite digital canvas</p>
        </header>

        <main class="canvas-wrapper">
            <div class="canvas-card">
                <canvas id="paintCanvas" aria-label="Drawing Canvas" tabIndex="0" role="img"></canvas>
                <div id="resizeHandle" title="Drag to resize canvas" aria-label="Resize canvas handle" tabindex="0" role="slider" aria-valuenow="100">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15L15 21M21 8L8 21" />
                    </svg>
                </div>
            </div>
        </main>

        <footer class="controls-toolbar" role="toolbar" aria-label="Drawing Tools">
            <!-- Color Picker & Swatches -->
            <div class="control-group colors-group">
                <label for="colorPicker" class="control-label">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"/><path d="M12 7a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/><path d="M7 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/><path d="M17 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/><path d="M12 17a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
                    <span>Color</span>
                </label>
                <div class="color-picker-wrapper">
                    <input type="color" id="colorPicker" value="#6366F1" aria-label="Choose custom color">
                </div>
                <div class="swatches-container" role="radiogroup" aria-label="Preset Colors">
                    <button type="button" class="swatch active" data-color="#6366F1" style="--swatch-color: #6366F1" aria-label="Indigo color preset" title="Indigo"></button>
                    <button type="button" class="swatch" data-color="#EC4899" style="--swatch-color: #EC4899" aria-label="Pink color preset" title="Pink"></button>
                    <button type="button" class="swatch" data-color="#EF4444" style="--swatch-color: #EF4444" aria-label="Red color preset" title="Red"></button>
                    <button type="button" class="swatch" data-color="#F59E0B" style="--swatch-color: #F59E0B" aria-label="Amber color preset" title="Amber"></button>
                    <button type="button" class="swatch" data-color="#10B981" style="--swatch-color: #10B981" aria-label="Emerald color preset" title="Emerald"></button>
                    <button type="button" class="swatch" data-color="#3B82F6" style="--swatch-color: #3B82F6" aria-label="Blue color preset" title="Blue"></button>
                    <button type="button" class="swatch" data-color="#000000" style="--swatch-color: #000000" aria-label="Black color preset" title="Black"></button>
                    <button type="button" class="swatch" data-color="#FFFFFF" style="--swatch-color: #FFFFFF" aria-label="White color preset" title="White"></button>
                </div>
            </div>

            <div class="toolbar-divider"></div>

            <!-- Brush Size -->
            <div class="control-group brush-group">
                <div class="brush-header">
                    <label for="brushSize" class="control-label">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
                        <span>Brush Size</span>
                    </label>
                    <span id="brushSizeDisplay" class="size-badge" aria-live="polite">5px</span>
                </div>
                <div class="slider-wrapper">
                    <input type="range" id="brushSize" min="1" max="50" value="5" aria-label="Brush size" aria-valuemin="1" aria-valuemax="50" aria-valuenow="5">
                    <div class="brush-preview-dot" id="brushPreviewDot"></div>
                </div>
            </div>

            <div class="toolbar-divider"></div>

            <!-- Actions -->
            <div class="control-group actions-group">
                <button id="clearButton" class="btn btn-secondary" aria-label="Clear Canvas (Shortcut: C)" title="Clear Canvas (Press C)">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                    <span>Clear</span>
                    <kbd class="shortcut-key">C</kbd>
                </button>
                <button id="saveButton" class="btn btn-primary" aria-label="Save Artwork PNG (Shortcut: S)" title="Save Artwork PNG (Press S)">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    <span>Save Artwork</span>
                    <kbd class="shortcut-key">S</kbd>
                </button>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
